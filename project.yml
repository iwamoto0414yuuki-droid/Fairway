name: Fairway
options:
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Fairway:
    type: application
    platform: iOS
    sources: [Shared, iPhone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fairway.score
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/iPhone-Info.plist
      properties:
        CFBundleDisplayName: Fairway
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: 距離を更新したときだけ、グリーン中央までの距離を測定します。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: FairwayWatch
        embed: true
  FairwayWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fairway.score.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: build/Watch-Info.plist
      properties:
        CFBundleDisplayName: Fairway
        WKApplication: true
        WKCompanionAppBundleIdentifier: local.fairway.score
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: 距離を更新したときだけ、グリーン中央までの距離を測定します。
  FairwayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Fairway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fairway:
    build:
      targets:
        Fairway: all
    test:
      targets: [FairwayTests]
  FairwayWatch:
    build:
      targets:
        FairwayWatch: all
